baseURL: "https://www.umutgokdemir.com/"
title: "Umut Gökdemir"

languageCode: "en-us"
defaultContentLanguage: "en"

theme: "tailbliss"

ignoreFiles:
  - 'themes/tailbliss/content/.*'

enableEmoji: true
enableGitInfo: false
enableRobotsTXT: true
enableInlineShortcodes: true

canonifyURLs: false

pagination:
  pagerSize: 9

darkmode_js:
  - assets/js/darkmode.js

# ============================================================
# MARKDOWN
# ============================================================

markup:
  goldmark:
    extensions:
      definitionList: true
      footnote: true
      linkify: true
      linkifyProtocol: "https"
      strikethrough: true
      table: true
      taskList: true

      typographer:
        apostrophe: "&rsquo;"
        disable: false
        ellipsis: "&hellip;"
        emDash: "&mdash;"
        enDash: "&ndash;"
        leftAngleQuote: "&laquo;"
        leftDoubleQuote: "&ldquo;"
        leftSingleQuote: "&lsquo;"
        rightAngleQuote: "&raquo;"
        rightDoubleQuote: "&rdquo;"
        rightSingleQuote: "&rsquo;"

    parser:
      attribute:
        block: false
        title: true
      autoHeadingID: true
      autoHeadingIDType: "github"
      wrapStandAloneImageWithinParagraph: true

    renderer:
      hardWraps: false
      unsafe: true
      xhtml: false

# ============================================================
# SITE / PORTFOLIO DATA
# ============================================================

params:
  author: "Umut Gökdemir"
  footer:
    show_social_icons: false
  seo_title: "Machine Learning Engineer | Umut Gökdemir"

  description: >-
    Machine Learning Engineer building reliable end-to-end systems across
    applied ML, NLP, retrieval and predictive modelling, with measurable,
    reproducible results.

  og_image: "/umut.jpeg"
  og_image_alt: "Umut Gökdemir — Machine Learning Engineer"

  moto: "Machine Learning Engineer"
  cv: "/umut_gokdemir_cv_english.pdf"
  email: "contact@umutgokdemir.com"

  # ----------------------------------------------------------
  # HERO
  # ----------------------------------------------------------

  hero:
    eyebrow: "Machine Learning Engineer"
    subtitle: "Applied ML · NLP · ML Systems"

    description: >-
      I build and evaluate end-to-end machine learning systems across NLP,
      retrieval and predictive modelling, with a focus on measurable performance
      and reproducible engineering.

    image: "images/umut.jpeg"
    image_alt: "Portrait of Umut Gökdemir"

    primary_button:
      text: "Explore my work"
      url: "/#projects"

    secondary_button:
      text: "Download CV"
      url: "/umut_gokdemir_cv_english.pdf"

  # ----------------------------------------------------------
  # FEATURED PROJECT
  # ----------------------------------------------------------

  featured_project:
    eyebrow: "Featured work"
    title: "CareerMatch Agent"
    category: "ML Systems · Retrieval · Evaluation"

    description: >-
      An end-to-end ML-assisted job-matching system combining deterministic
      constraints, multilingual semantic retrieval, hybrid ranking and
      evidence-grounded LLM evaluation.

    technologies:
      - "Python"
      - "LangGraph"
      - "FastAPI"
      - "SentenceTransformers"
      - "OpenAI"
      - "Gemini"
      - "Ollama"

    workflow:
      - title: "Candidate understanding"
        text: "Extract structured candidate information from CV data and preferences."

      - title: "Hybrid retrieval"
        text: "Combine deterministic constraints with multilingual semantic ranking."

      - title: "LLM evaluation"
        text: "Evaluate matches with evidence-grounded reasoning instead of opaque scoring."

      - title: "Explainable output"
        text: "Return ranked opportunities with clear supporting evidence and rationale."

    highlights:
      - title: "Multi-provider architecture"
        text: "Interchangeable OpenAI, Gemini and Ollama model providers."

      - title: "Evaluation-driven"
        text: "Benchmark tooling for ranking quality, retrieval metrics and latency."

      - title: "Engineering-first"
        text: "API-based design with automated tests and reproducible workflows."

    github: "https://github.com/LittleBigPluton/career-match-agent"
    details: "/projects/career-match-agent/"

  # ----------------------------------------------------------
  # SELECTED PROJECTS
  # ----------------------------------------------------------
  projects:
    eyebrow: "Selected projects"
    heading: "Machine learning and performance engineering"
    intro: >-
      A focused set of projects demonstrating end-to-end ML systems,
      rigorous model evaluation and performance-oriented engineering.

    items:
      - title: "Predictive Maintenance ML"
        category: "Applied Machine Learning"

        description: >-
          Built an end-to-end predictive-maintenance pipeline for imbalanced
          equipment-failure classification, combining domain-informed feature
          engineering, cross-validated model selection, threshold optimization
          and systematic error analysis.

        result: >-
          Achieved 0.876 held-out test Average Precision with 0.947 precision
          and 0.794 recall.

        technologies:
          - "Python"
          - "scikit-learn"
          - "XGBoost"
          - "Model Evaluation"

        details: "/projects/predictive-maintenance/"

      - title: "GPU-Accelerated Satellite Constellation Simulation"
        category: "Performance Engineering · Scientific Computing"

        description: >-
          Built and benchmarked a C++17/CUDA satellite simulation against
          serial CPU execution, with explicit CPU/GPU correctness validation
          and reproducible performance measurement.

        result: >-
          Achieved 48.55× single-step kernel speedup and 46.84× end-to-end
          acceleration for a 1M-satellite, 100-step GPU-resident workload.

        technologies:
          - "CUDA"
          - "C++17"
          - "Parallel Computing"
          - "Benchmarking"

        details: "/projects/gpu-accelerated-satellite-constellation-simulation/"


  # ----------------------------------------------------------
  # TECHNICAL TOOLKIT
  # ----------------------------------------------------------

  skills:
    eyebrow: "Technical toolkit"

    heading: "Tools I use to build, evaluate and engineer ML systems"

    intro: >-
      My strongest work sits at the intersection of machine learning,
      NLP, retrieval and production-minded ML engineering.

    groups:

      - title: "Machine Learning"
        items:
          - "PyTorch"
          - "scikit-learn"
          - "pandas"
          - "NumPy"
          - "Deep Learning"
          - "Model Evaluation"
          - "Clustering"

      - title: "NLP & Retrieval"
        items:
          - "Hugging Face"
          - "Transformers"
          - "SentenceTransformers"
          - "Semantic Search"
          - "Embeddings"
          - "Named Entity Recognition"

      - title: "LLM Systems"
        items:
          - "LangGraph"
          - "Agentic Workflows"
          - "LLM Evaluation"
          - "Evidence-Grounded AI"
          - "OpenAI"
          - "Gemini"
          - "Ollama"

      - title: "ML Engineering"
        items:
          - "Python"
          - "FastAPI"
          - "Pydantic"
          - "REST APIs"
          - "HTTPX"
          - "Streamlit"

      - title: "Testing & Code Quality"
        items:
          - "pytest"
          - "Unit Testing"
          - "Integration Testing"
          - "mypy"
          - "Ruff"
          - "Type Checking"

      - title: "Infrastructure & Development"
        items:
          - "Docker"
          - "Git"
          - "GitHub Actions"
          - "CI/CD"
          - "Linux"
          - "AWS"

  # ----------------------------------------------------------
  # EXPERIENCE
  # ----------------------------------------------------------

  experience:

    eyebrow: "Professional experience"

    heading: "Machine Learning Experience"

    intro: >-
      Applied machine learning experience across NLP and high-dimensional
      scientific data, spanning data preparation, model development,
      evaluation and reproducible experimentation.

    items:

      - title: "Machine Learning Engineer Intern"
        organization: "EnlightyAI"
        period: "May 2025 – October 2025"
        location: "Remote"
        bullets:
          - >-
            Improved span-level micro-F1 from **0.44 to 0.75** by fine-tuning
            and evaluating transformer-based NER models for noisy Turkish
            social-media text.

          - >-
            Improved training-data quality across **6,000 annotated tweets** by
            coordinating annotation and validation workflows, refining
            preprocessing and systematically investigating annotation and
            prediction errors.

          - >-
            Strengthened model selection and experimentation by benchmarking
            **multiple BERT and XLM-R variants** through reproducible training,
            validation and error analysis.

          - >-
            Led an **8-person internship team** by planning workloads, assigning
            tasks, running weekly progress meetings and consolidating progress
            reports, helping keep annotation, preprocessing, training and
            evaluation work aligned across the project.


      - title: "Machine Learning Engineer Intern"
        organization: "Functional Genomics Laboratory Regensburg"
        period: "March 2024 – June 2024"
        location: "Regensburg, Germany"
        bullets:
          - >-
            Reduced the analysis data footprint by approximately **40%** by
            building a Python preprocessing pipeline for cleaning,
            restructuring and optimizing high-dimensional DESI
            mass-spectrometry imaging data.

          - >-
            Preserved **95% of explained variance** while reducing feature
            dimensionality by applying PCA before unsupervised tissue-region
            segmentation with four-cluster K-means.

          - >-
            Improved the interpretability of **unsupervised tissue segmentation**
            by mapping cluster assignments back to spatial coordinates and
            validating molecular-density patterns across follow-up scan series.

          - >-
            Worked within an **interdisciplinary research team** by communicating
            analysis progress through weekly reports, incorporating domain
            feedback into the workflow, presenting the methodology
            and results to the team and stakeholders.

  # ----------------------------------------------------------
  # LEADERSHIP & COMMUNITY
  # ----------------------------------------------------------

  leadership:

    eyebrow: "Leadership & community"
    heading: "Leadership Beyond Engineering"
    intro: >-
      Long-term experience in team leadership, mentoring,
      operations and community organization.

    items:
      - title: "Scout Leader & Association President"
        organization: "Camadan Scout, Youth and Sport Association"
        period: "April 2014 – April 2021"
        bullets:
          - >-
            Led the training and development of approximately 15–20 scouts
            each year by designing recurring educational programs, preparing
            training materials and delivering practical and theoretical sessions.

          - >-
            Managed camps and community activities end to end, coordinating
            logistics, schedules, equipment, accommodation, safety and
            communication with participants and families.

          - >-
            Directed association operations as President through volunteer
            coordination, delegation, budgeting, external partnerships and
            leadership meetings, while mentoring senior scouts into future
            leader and instructor roles.

  # ----------------------------------------------------------
  # EDUCATION
  # ----------------------------------------------------------

  education:
    eyebrow: "Research & education"
    heading: "Quantitative foundations for machine learning"

    items:
      - degree: "M.Sc."
        title: "Computational Science"
        institution: "University of Regensburg"
        period: "2026"
        description: >-
          Advanced training in machine learning, numerical methods,
          scientific computing and computational modelling, with
          hands-on work on data-driven and simulation-based problems.

      - degree: "B.Sc."
        title: "Physics"
        institution: "Middle East Technical University"
        period: "2021"
        description: >-
          Built a rigorous foundation in mathematical modelling,
          numerical problem solving and computational physics,
          including research experience in quantum many-body systems.

  # ----------------------------------------------------------
  # ABOUT
  # ----------------------------------------------------------

  about:
    eyebrow: "About"
    heading: "Physics-trained. Engineering-focused."

    text: >-
      Machine Learning Engineer with a computational science and physics
      background, building reliable ML systems across NLP, retrieval and
      predictive modelling with measurable, reproducible results.

  # ----------------------------------------------------------
  # CONTACT
  # ----------------------------------------------------------

  contact:
   eyebrow: "Contact"
   heading: "Open to machine learning opportunities"
   text: >-
     I am interested in Machine Learning Engineering, Applied ML
     and AI Engineering opportunities where I can work on meaningful
     models, data and production-oriented AI systems. For opportunities,
     collaborations or technical conversations, feel free to reach out.

